version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: brightloop-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: subscription_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subscription_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: brightloop-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/subscription_db?schema=public
      JWT_SECRET: super-secret-jwt-key-brightloop-123456789
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      ENABLE_CRON: "true"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: brightloop-client
    restart: always
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:80"
      - "80:80"

volumes:
  pgdata:
